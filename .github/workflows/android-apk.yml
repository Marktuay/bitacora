name: APK Bitácora KM
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar firma de actualización del APK
        env:
          PILOT_KEYSTORE_B64: ${{ secrets.BITACORA_PILOT_KEYSTORE_B64 }}
        run: |
          test -n "$PILOT_KEYSTORE_B64" || { echo "No está configurada la firma del APK"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bitacora-signing"
          printf '%s' "$PILOT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bitacora-signing/pilot.keystore"
          echo "BITACORA_PILOT_KEYSTORE=$RUNNER_TEMP/bitacora-signing/pilot.keystore" >> "$GITHUB_ENV"
      - name: Compilar y probar aplicación Android
        env:
          BITACORA_PILOT_STORE_PASSWORD: ${{ secrets.BITACORA_PILOT_STORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Publicar instalador en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Bitacora-KM-1.4.11.apk
          if gh release view "apk-1.4.11" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "apk-1.4.11" Bitacora-KM-1.4.11.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "apk-1.4.11" Bitacora-KM-1.4.11.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Bitácora KM 1.4.11" \
              --notes "APK 1.4.11. Reportes Excel/PDF y WhatsApp unificados, Desde/Hasta sin Mes ni cortes; administrador sin selección obligatoria de colaborador. Conserva GPS y registros."
          fi
